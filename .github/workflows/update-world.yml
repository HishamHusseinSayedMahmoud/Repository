name: update-world
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-world.mjs
      - name: Commit and push world.json
        run: |
          git config --global user.name "world-bot"
          git config --global user.email "world-bot@users.noreply.github.com"
          git add world.json
          git commit -m "Auto-update world.json data" || echo "No changes to commit"
          git push
