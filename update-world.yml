name: update-world
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-world.mjs
      - name: Commit changes
        run: |
          git config user.name "world-bot"
          git config user.email "world-bot@users.noreply.github.com"
          git add world.json config/baseline.json
          git diff --cached --quiet || (git commit -m "update world data" && git push)
