name: update-restaurants
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-restaurants.mjs cairo
      - name: Commit changes
        run: |
          git config user.name "world-bot"
          git config user.email "world-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update restaurants data" && git push)
